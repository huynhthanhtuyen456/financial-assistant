{% extends "base.html" %}
{% block title %}Data Distribution EDA{% endblock %}

{% block footer %}

        <div class="row mb-4 text-center">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="card-title mb-0">Financial Data Distribution</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mb-4 text-center">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div id="plotly-graph">
                            {{ fig_html | safe }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mb-4 text-center">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div id="plotly-graph">
                            {{ fig_distribution_bs_html | safe }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mb-4 text-center">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div id="plotly-graph">
                            {{ fig_distribution_cf_html | safe }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
